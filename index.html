<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RI Smart Scanner AI</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    background:#334155;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

.result{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:#111827;
}

.buy{
    color:#22c55e;
}

.warn{
    color:#facc15;
}

.danger{
    color:#ef4444;
}

h1{
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 RI SMART MONEY AI</h1>

<div class="card">

<label>Harga Sekarang</label>
<input type="number" id="price" placeholder="850">

<label>Harga Right Issue</label>
<input type="number" id="ri" placeholder="100">

<label>Volume Hari Ini</label>
<input type="number" id="vol" placeholder="500000000">

<label>Volume Rata-rata</label>
<input type="number" id="avgVol" placeholder="100000000">

<label>Market Cap (Miliar)</label>
<input type="number" id="mc" placeholder="300">

<button onclick="analyze()">SCAN SAHAM RI</button>

<div class="result" id="result">

Menunggu scan...

</div>

</div>

</div>

<script>

function analyze(){

let price = parseFloat(document.getElementById("price").value);
let ri = parseFloat(document.getElementById("ri").value);
let vol = parseFloat(document.getElementById("vol").value);
let avgVol = parseFloat(document.getElementById("avgVol").value);
let mc = parseFloat(document.getElementById("mc").value);

let score = 0;
let text = "";

let discount = ((price-ri)/price)*100;
let volBoost = vol/avgVol;

if(discount > 50){
    score += 35;
    text += "<p class='buy'>✅ Diskon RI sangat besar</p>";
}

if(volBoost > 3){
    score += 30;
    text += "<p class='buy'>🔥 Volume meledak = indikasi akumulasi</p>";
}

if(mc < 500){
    score += 20;
    text += "<p class='warn'>⚡ Market cap kecil = mudah digerakkan bandar</p>";
}

if(price > ri){
    score += 15;
}

let prediction = "";

if(score >= 80){
    prediction = `
    <h2 class='buy'>🚀 POTENSI TERBANG BESAR</h2>
    <p>Potensi kenaikan: 100% - 300%</p>
    `;
}
else if(score >= 50){
    prediction = `
    <h2 class='warn'>⚠️ POTENSI MENARIK</h2>
    <p>Potensi kenaikan: 30% - 100%</p>
    `;
}
else{
    prediction = `
    <h2 class='danger'>❌ RISIKO TINGGI</h2>
    <p>Belum ada indikasi smart money kuat</p>
    `;
}

document.getElementById("result").innerHTML = `
<h2>AI SCORE : ${score}/100</h2>
${prediction}
${text}

<hr>

<p>Diskon RI: ${discount.toFixed(2)}%</p>
<p>Volume Boost: ${volBoost.toFixed(2)}x</p>

`;

}

</script>

</body>
</html>
