<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMART MONEY AI RI SCANNER</title>

<style>

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial;
}

.header{
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    background:#0f172a;
    border-bottom:1px solid #1e293b;
}

.container{
    padding:20px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.buy{
    color:#22c55e;
}

.warn{
    color:#facc15;
}

.sell{
    color:#ef4444;
}

.score{
    font-size:34px;
    font-weight:bold;
    margin-top:10px;
}

.small{
    opacity:0.8;
    margin-top:5px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

.loading{
    text-align:center;
    opacity:0.7;
    margin-top:30px;
}

</style>

</head>

<body>

<div class="header">
🚀 SMART MONEY AI RI SCANNER
</div>

<div class="container">

<button onclick="scanMarket()">
AUTO SCAN MARKET
</button>

<div id="result">

<div class="loading">
Menunggu scan market...
</div>

</div>

</div>

<script>

async function scanMarket(){

document.getElementById("result").innerHTML = `
<div class="loading">
🔍 AI sedang scan TradingView Indonesia...
</div>
`;

try{

const response = await fetch(
'https://scanner.tradingview.com/indonesia/scan',
{
method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

symbols:{
tickers:[],
query:{
types:[]
}
},

columns:[

'name',
'close',
'volume',
'market_cap_basic',
'RSI',
'MACD.macd',
'MACD.signal',
'Recommend.All'

]

})

});

const data = await response.json();

let html = "";

let saham = data.data;

saham.forEach(stock=>{

let d = stock.d;

let kode = d[0];
let harga = d[1];
let volume = d[2];
let mc = d[3];
let rsi = d[4];
let macd = d[5];
let signal = d[6];
let rec = d[7];

let score = 0;

let alasan = [];

if(rec > 0.5){
score += 25;
alasan.push("✅ TradingView BUY");
}

if(rsi > 50 && rsi < 70){
score += 20;
alasan.push("🔥 RSI sehat");
}

if(macd > signal){
score += 25;
alasan.push("🚀 MACD bullish");
}

if(volume > 100000000){
score += 20;
alasan.push("💰 Volume besar");
}

if(mc < 1000000000){
score += 10;
alasan.push("⚡ Small cap");
}

let prediksi = "";
let warna = "sell";

if(score >= 70){
prediksi = "🚀 POTENSI TERBANG";
warna = "buy";
}
else if(score >= 45){
prediksi = "⚠️ MENARIK";
warna = "warn";
}
else{
prediksi = "❌ BELUM ADA SMART MONEY";
}

html += `

<div class="card">

<h2>${kode}</h2>

<div class="score ${warna}">
${score}/100
</div>

<h3 class="${warna}">
${prediksi}
</h3>

<div class="small">
Harga : Rp${harga}
</div>

<div class="small">
Volume : ${volume.toLocaleString()}
</div>

<div class="small">
RSI : ${rsi}
</div>

<div class="small">
Market Cap : ${mc}
</div>

<hr style="margin:15px 0;border-color:#1e293b">

${alasan.map(a=>`<p>${a}</p>`).join("")}

</div>

`;

});

document.getElementById("result").innerHTML = html;

}
catch(err){

document.getElementById("result").innerHTML = `

<div class="card">

<h2 class="sell">
❌ ERROR
</h2>

<p>
Kemungkinan TradingView memblok request langsung dari browser.
</p>

<p>
Solusi:
</p>

<p>
1. Deploy ke Vercel</p>
<p>
2. Pakai proxy API</p>
<p>
3. Pakai Node.js backend</p>

</div>

`;

}

}

scanMarket();

</script>

</body>
</html>
