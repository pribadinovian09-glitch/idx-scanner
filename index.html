<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Crypto Prediction V1</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050816;
    color:white;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.title{
    text-align:center;
    font-size:32px;
    margin-top:20px;
}

.card{
    background:#111827;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
    border-left:5px solid #22c55e;
}

.symbol{
    font-size:20px;
    font-weight:bold;
}

.badge{
    float:right;
    background:#3b82f6;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
}

.prob{
    margin-top:8px;
    color:#38bdf8;
}

.low{
    color:#facc15;
}

.high{
    color:#22c55e;
}
</style>
</head>

<body>

<div class="container">

<div class="title">🧠 AI Crypto Prediction V1</div>

<div id="market"></div>

</div>

<script>

async function run(){

const res = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr");
const data = await res.json();

let html = "";

const coins = data
.filter(c => c.symbol.endsWith("USDT"))
.slice(0,15)
.map(c => {

let priceChange = parseFloat(c.priceChangePercent);
let volume = parseFloat(c.quoteVolume);
let count = parseFloat(c.count);

/* =========================
   AI FEATURE ENGINE
========================= */

// feature 1: momentum
let momentum = priceChange * 10;

// feature 2: volume strength
let volScore = (volume / 100000000) * 10;

// feature 3: activity
let activity = count / 10000;

/* =========================
   SIMPLE AI MODEL (SIMULATED)
   logistic-style scoring
========================= */

let rawScore =
(momentum * 0.5) +
(volScore * 0.3) +
(activity * 0.2);

/* convert to probability (0–100) */
let probabilityUP = 1 / (1 + Math.exp(-rawScore / 10)) * 100;

/* =========================
   SIGNAL CLASSIFICATION
========================= */

let signal = "⚠️ NO EDGE";
let color = "low";

if(probabilityUP > 70){
    signal = "🚀 HIGH PROBABILITY UP";
    color = "high";
}
else if(probabilityUP > 55){
    signal = "⚡ MODERATE SETUP";
    color = "high";
}
else{
    signal = "⚠️ WEAK / NO TRADE";
    color = "low";
}

return {
symbol:c.symbol,
priceChange:priceChange,
volume:volume,
probabilityUP:probabilityUP,
signal:signal,
color:color
};

})
.sort((a,b)=>b.probabilityUP-a.probabilityUP);

coins.forEach(c=>{

html += `
<div class="card">

<div class="symbol">
${c.symbol}
<span class="badge">${c.probabilityUP.toFixed(1)}%</span>
</div>

<div class="prob ${c.color}">
📊 Signal: ${c.signal}<br>
📈 1D Change: ${c.priceChange}%<br>
💰 Volume: ${(c.volume/1000000).toFixed(0)}M<br>
</div>

</div>
`;
});

document.getElementById("market").innerHTML = html;

}

run();
setInterval(run,5000);

</script>

</body>
</html>
